
name: ZinKit Android Build Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZinKit
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Android Project
        run: |
          echo "Checking ZinKit Android files"
          find . -maxdepth 3 -type f | head -80
          if [ -f gradlew ]; then
            echo "Gradle wrapper found"
          else
            echo "Android Gradle wrapper missing"
          fi
